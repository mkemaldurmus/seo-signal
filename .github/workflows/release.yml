name: release

# Publishes to npm when a v* tag is pushed.
#
# Uses npm Trusted Publishing (OIDC), so there is no NPM_TOKEN secret anywhere
# and no 2FA prompt: npm verifies the workflow's identity directly against the
# repository. That matters because npm is actively restricting tokens that
# bypass 2FA for direct publishing, which is the route this would otherwise
# have taken.
#
# One-time setup on npmjs.com, package -> Settings -> Trusted Publisher:
#   organization/user  mkemaldurmus
#   repository         seo-signal
#   workflow filename  release.yml
#
# Then releasing is:
#   npm version patch   # or minor / major — commits and tags
#   git push --follow-tags

on:
  push:
    tags: ['v*']
  # Lets a release be re-run from the Actions tab if a publish fails halfway.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Deliberately no registry-url here. setup-node would write an .npmrc
      # containing //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}, and with
      # no token secret that becomes a literal placeholder — npm then treats it
      # as credentials, skips the OIDC exchange entirely, and the publish comes
      # back as a masked 401 (npm reports it as 404 on an existing package).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Trusted publishing needs a recent npm; the one bundled with Node 22 is
      # older than the OIDC support.
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest

      # Never publish a broken tag. Same suite CI runs on every push.
      - name: Test
        run: node --test

      - name: Assert the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $PKG" >&2
            exit 1
          fi
          echo "publishing $PKG"

      # Tagging a version that is already on the registry should be a no-op, not
      # a red build. Makes the workflow safe to re-run and safe to tag
      # retroactively for versions that were published by hand.
      - name: Publish unless this version is already on the registry
        run: |
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then
            echo "$PKG@$VER is already published — nothing to do"
            exit 0
          fi
          npm publish
